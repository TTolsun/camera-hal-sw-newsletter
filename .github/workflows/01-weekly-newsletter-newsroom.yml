name: 01 - Manual Newsletter Publish

on:
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: manual-newsletter-publish
  cancel-in-progress: false

jobs:
  create-newsletter-pr:
    runs-on: ubuntu-latest

    env:
      NEWSLETTER_DATE: ${{ github.event.inputs.newsletter_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Register manual newsletter
        run: |
          node scripts/register-manual-newsletter.js

      - name: Validate generated site
        run: |
          node scripts/validate-site.js

      - name: Resolve newsletter date
        id: meta
        run: |
          DATE=$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('data/newsletters.json','utf8'));console.log(data[0].date)")
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=manual-newsletter/${DATE}" >> "$GITHUB_OUTPUT"

      - name: Create or update branch
        run: |
          BRANCH="${{ steps.meta.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/newsletters.json newsletters/ newsroom/
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Register manual newsletter ${{ steps.meta.outputs.date }}"
          git push --force-with-lease origin "$BRANCH"

      - name: Create pull request
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.meta.outputs.date }}';
            const branch = '${{ steps.meta.outputs.branch }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `[Newsletter] Publish Camera HAL SW Newsletter - ${date}`;

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main',
              per_page: 10
            });

            const body = [
              '## Summary',
              '',
              `ChatGPT에서 수집/편집한 Camera HAL SW Newsletter ${date} 발행 PR입니다.`,
              '',
              '## Workflow Roles',
              '',
              '- [x] 기자: 김경환 / ChatGPT',
              '- [x] 편집자: 김경환 / ChatGPT',
              '- [ ] 편집장: 김경환 최종 승인',
              '- [x] 검수자: GitHub Action validate-site.js',
              '- [x] 업데이터: GitHub Action data/newsletters.json 반영',
              '',
              '## Updated Files',
              '',
              `- newsletters/${date}/index.html`,
              `- newsletters/${date}/newsletter.md`,
              '- data/newsletters.json',
              `- newsroom/${date}/news-candidates.md`,
              `- newsroom/${date}/editor-draft.md`,
              `- newsroom/${date}/fact-check-report.md`,
              `- newsroom/${date}/editor-in-chief-brief.md`,
              `- newsroom/${date}/release-qa-report.md`,
              '',
              '## Editor-in-Chief Review',
              '',
              '김경환 편집장은 아래를 확인합니다.',
              '',
              '- 이번 호 핵심 메시지가 명확한가?',
              '- Camera HAL 엔지니어가 읽을 이유가 있는가?',
              '- 단순 요약이 아니라 HAL 관점 해석이 있는가?',
              '- 출처와 검수 결과가 충분한가?',
              '- 팀 공유용으로 발행해도 되는가?',
              '',
              '## Note',
              '',
              '이 PR은 자동 merge하지 않습니다. 편집장 승인 후 merge하세요.'
            ].join('\n');

            if (prs.data.length > 0) {
              const pr = prs.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body
              });
              core.info(`Updated existing PR #${pr.number}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title,
              body,
              head: branch,
              base: 'main',
              draft: false
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.data.number,
              labels: ['newsletter', 'weekly']
            });

            core.info(`Created PR #${pr.data.number}`);
