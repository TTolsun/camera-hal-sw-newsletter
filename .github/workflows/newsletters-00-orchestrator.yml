name: Newsletters 00 - Weekly Orchestrator

on:
  schedule:
    - cron: "0 0 * * 1" # KST weekly Mon 09:00
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        default: ""
        type: string
      coverage_week_key:
        description: "Coverage 주 override, 형식 YYYY-Www(예: 2026-W34). 비우면 실행일 기준 자동 계산(scheduled 실행의 기본 경로)."
        required: false
        default: ""
        type: string
      carry_source_path:
        description: "Carry-forward 원천 merged-candidates.json 경로 override(저장소 상대 또는 절대 경로). 비우면 직전 주 scheduled 실행분을 자동으로 찾는다."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: newsroom-daily-${{ github.event.inputs.newsletter_date || 'auto-kst-today' }}
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/newsletters-01-source-collect-pr.yml
    with:
      newsletter_date: ${{ github.event.inputs.newsletter_date || '' }}
      coverage_week_key: ${{ github.event.inputs.coverage_week_key || '' }}
      carry_source_path: ${{ github.event.inputs.carry_source_path || '' }}
      auto_mode: true
    secrets: inherit

  discover:
    needs: collect
    uses: ./.github/workflows/newsletters-02-source-discovery-pr.yml
    with:
      newsletter_date: ${{ needs.collect.outputs.date }}
      coverage_week_key: ${{ github.event.inputs.coverage_week_key || '' }}
      carry_source_path: ${{ github.event.inputs.carry_source_path || '' }}
      auto_mode: true
    secrets: inherit

  generate:
    needs: [collect, discover]
    # Source discovery (job 02) is an optional enrichment stage that proposes new
    # sources; its failure must not hard-block the daily newsletter. Run generate
    # whenever collect succeeded, regardless of discover's result. Generate reads
    # collect's committed candidates in artifact mode and degrades gracefully when
    # discover's merged candidates are absent.
    if: ${{ always() && needs.collect.result == 'success' }}
    uses: ./.github/workflows/newsletters-03-editor-pr.yml
    with:
      newsletter_date: ${{ needs.collect.outputs.date }}
      # generate가 select 체인을 다시 돌려 shortlist/최종 후보를 재계산한다(newsroom-selection.js
      # buildShortlistReport). collect와 같은 coverage 주 override를 못 받으면 같은 주 안에서
      # 서로 다른 대상 주를 계산해 weekly upsert hard-fail(Task 11)을 오탐시킬 수 있다.
      # carry_source_path는 여기서 전달하지 않는다 — carry-forward 로딩은 collect(01)
      # 단계에서만 일어난다(loadCarryForward 호출부가 collect-news-candidates.js뿐).
      coverage_week_key: ${{ github.event.inputs.coverage_week_key || '' }}
    secrets: inherit

  summary:
    needs: [collect, discover, generate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write workflow run summary
        continue-on-error: true
        env:
          SUMMARY_PROFILE: auto-daily
          OUTCOME_COLLECT: ${{ needs.collect.result }}
          OUTCOME_DISCOVERY: ${{ needs.discover.result }}
          OUTCOME_EDITOR: ${{ needs.generate.result }}
          NEWSLETTER_DATE: ${{ needs.collect.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node src/shared/tooling/cli/write-newsroom-workflow-summary.js --profile "$SUMMARY_PROFILE"
