name: Weekly Gemini Newsroom PR

on:
  schedule:
    - cron: "0 0 * * *" # KST daily 09:00
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
      lookback_days:
        description: "How many days to look back when collecting news candidates."
        required: false
        default: "21"
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-gemini-newsroom-pr
  cancel-in-progress: false

jobs:
  create-newsroom-pr:
    runs-on: ubuntu-latest

    env:
      NEWSLETTER_DATE: ${{ github.event.inputs.newsletter_date }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '21' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-2.5-flash-lite,gemini-2.5-pro' }}
      GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES || '2' }}
      GEMINI_RETRY_DELAYS_MS: ${{ vars.GEMINI_RETRY_DELAYS_MS || '20000,10000' }}
      GEMINI_RETRY_MAX_DELAY_MS: ${{ vars.GEMINI_RETRY_MAX_DELAY_MS || '180000' }}
      NEWSROOM_MAX_QUALITY_RETRIES: ${{ vars.NEWSROOM_MAX_QUALITY_RETRIES || '3' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Doctor runtime config
        run: npm run doctor:config

      - name: Jitter scheduled run
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( RANDOM % 300 ))
          echo "Sleeping ${DELAY}s to avoid fixed-minute API demand spikes."
          sleep "${DELAY}"

      - name: Collect news candidates
        run: npm run collect

      - name: Restore URL summary cache
        uses: actions/cache@v4
        with:
          path: cache/news-summary
          key: news-summary-${{ runner.os }}-${{ hashFiles('collected-news/**/candidates.json') }}
          restore-keys: |
            news-summary-${{ runner.os }}-

      - name: Generate newsletter with Gemini newsroom
        id: generate
        continue-on-error: true
        run: npm run generate

      - name: Validate generated site
        id: validate
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          REQUIRE_NEWSLETTER_DATE_FILE: "1"
        run: npm run validate

      - name: Resolve newsletter metadata
        id: meta
        if: steps.generate.outcome == 'success'
        run: |
          DATE=$(cat .tmp/newsletter-date.txt)
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=newsletter/${DATE}" >> "$GITHUB_OUTPUT"

      - name: Resolve generation status
        id: generation-status
        if: steps.generate.outcome == 'success'
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const { renderCandidateSelectionDiagnostics } = require('./scripts/lib/selection-diagnostics');
          const statusPath = '.tmp/newsletter-generation-status.json';
          const status = fs.existsSync(statusPath)
            ? JSON.parse(fs.readFileSync(statusPath, 'utf8'))
            : { status: 'UNKNOWN', must_fix_count: 0 };
          console.log(`status=${status.status || 'UNKNOWN'}`);
          console.log(`must_fix_count=${status.must_fix_count || 0}`);
          console.log(`quality_status=${status.quality_status || 'UNKNOWN'}`);
          console.log(`quality_score=${status.quality_score ?? 'n/a'}`);
          console.log(`quality_threshold=${status.quality_threshold ?? 'n/a'}`);
          console.log(`quality_attempt_count=${status.quality_attempt_count ?? 'n/a'}`);
          console.log(`locked_article_count=${status.locked_article_count ?? 'n/a'}`);
          console.log(`publish_ready=${status.publish_ready === true ? 'true' : 'false'}`);
          console.log(`underfilled=${status.underfilled === true ? 'true' : 'false'}`);
          console.log(`input_candidate_count=${status.input_candidate_count ?? 'n/a'}`);
          console.log(`eligible_candidate_count=${status.eligible_candidate_count ?? 'n/a'}`);
          console.log(`selected_article_count=${status.selected_article_count ?? 'n/a'}`);
          console.log(`reporter_candidate_count=${status.reporter_candidate_count ?? 'n/a'}`);
          console.log(`reporter_selected_count=${status.reporter_selected_count ?? 'n/a'}`);
          console.log(`final_input_candidate_count=${status.final_input_candidate_count ?? status.input_candidate_count ?? 'n/a'}`);
          console.log(`final_eligible_candidate_count=${status.final_eligible_candidate_count ?? status.eligible_candidate_count ?? 'n/a'}`);
          console.log(`final_selected_article_count=${status.final_selected_article_count ?? status.selected_article_count ?? 'n/a'}`);
          console.log(`reporter_selected_but_final_excluded_count=${status.reporter_selected_but_final_excluded_count ?? 'n/a'}`);
          console.log(`selection_warnings<<EOF`);
          console.log((status.selection_warnings || []).join('; ') || 'none');
          console.log(`EOF`);
          console.log(`exclusion_reason_summary<<EOF`);
          console.log((status.exclusion_reason_summary || []).slice(0, 5).map(item => `${item.reason} (${item.count})`).join('; ') || 'none');
          console.log(`EOF`);
          console.log(`final_exclusion_reason_summary<<EOF`);
          console.log((status.final_exclusion_reason_summary || status.exclusion_reason_summary || []).slice(0, 5).map(item => `${item.reason} (${item.count})`).join('; ') || 'none');
          console.log(`EOF`);
          console.log(`candidate_selection_diagnostics<<EOF`);
          console.log(renderCandidateSelectionDiagnostics(status));
          console.log(`EOF`);
          NODE

      - name: Snapshot newsroom debug artifacts
        if: always()
        run: |
          set -euo pipefail

          SNAPSHOT=".tmp/artifact-snapshot"
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"

          HAS_GENERATED_DATE="0"
          if [ -f .tmp/newsletter-date.txt ]; then
            DATE=$(cat .tmp/newsletter-date.txt)
            HAS_GENERATED_DATE="1"
          elif [ -n "${NEWSLETTER_DATE:-}" ]; then
            DATE="${NEWSLETTER_DATE}"
          else
            DATE=$(TZ=Asia/Seoul date +%F)
          fi

          copy_if_present() {
            local src="$1"
            local dest="$SNAPSHOT/$src"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dest")"
              cp "$src" "$dest"
            fi
          }

          copy_tree_if_present() {
            local src="$1"
            local dest="$SNAPSHOT/$src"
            if [ -d "$src" ]; then
              mkdir -p "$(dirname "$dest")"
              cp -R "$src" "$dest"
            fi
          }

          copy_if_present ".tmp/newsletter-date.txt"
          copy_if_present ".tmp/newsletter-generation-status.json"
          copy_tree_if_present ".tmp/gemini-raw"
          copy_tree_if_present "cache/news-summary"
          if [ "$HAS_GENERATED_DATE" = "1" ]; then
            copy_if_present "collected-news/${DATE}/candidates.json"
            copy_tree_if_present "newsroom/${DATE}"
            copy_if_present "newsletters/${DATE}/newsletter.md"
            copy_if_present "newsletters/${DATE}/index.html"
            copy_if_present "data/newsletters.json"
          else
            echo "No generated .tmp/newsletter-date.txt found; skipping date-scoped artifact copy to avoid stale base-branch files."
          fi

          node scripts/write-artifact-manifest.js "$SNAPSHOT" "$DATE"

      - name: Prepare pull request body
        id: pr-body
        if: steps.generate.outcome == 'success'
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          {
            echo "body<<EOF"
            cat "newsroom/${DATE}/editor-in-chief-brief.md"
            echo ""
            echo "## Generation Status"
            echo ""
            echo "- Status: \`${{ steps.generation-status.outputs.status }}\`"
            echo "- Fact-check must-fix count: \`${{ steps.generation-status.outputs.must_fix_count }}\`"
            echo "- Quality score: \`${{ steps.generation-status.outputs.quality_score }}/${{ steps.generation-status.outputs.quality_threshold }}\`"
            echo "- Quality status: \`${{ steps.generation-status.outputs.quality_status }}\`"
            echo "- Quality attempts: \`${{ steps.generation-status.outputs.quality_attempt_count }}\`"
            echo "- Locked articles: \`${{ steps.generation-status.outputs.locked_article_count }}\`"
            echo "- Validation outcome: \`${{ steps.validate.outcome }}\`"
            echo "- Publish ready: \`${{ steps.generation-status.outputs.publish_ready }}\`"
            echo "- Underfilled thin-week path: \`${{ steps.generation-status.outputs.underfilled }}\`"
            echo ""
            node - <<'NODE'
            const fs = require('fs');
            const { renderCandidateSelectionDiagnostics } = require('./scripts/lib/selection-diagnostics');
            const status = JSON.parse(fs.readFileSync('.tmp/newsletter-generation-status.json', 'utf8'));
            console.log(renderCandidateSelectionDiagnostics(status));
            NODE
            echo ""
            echo "## Deterministic Final Selection Status"
            echo ""
            echo "- Final input candidates: \`${{ steps.generation-status.outputs.final_input_candidate_count }}\`"
            echo "- Final eligible candidates: \`${{ steps.generation-status.outputs.final_eligible_candidate_count }}\`"
            echo "- Final selected articles: \`${{ steps.generation-status.outputs.final_selected_article_count }}\`"
            echo "- Selection warnings: ${{ steps.generation-status.outputs.selection_warnings }}"
            echo "- Top final exclusion reasons: ${{ steps.generation-status.outputs.final_exclusion_reason_summary }}"
            if [ "${{ steps.generation-status.outputs.status }}" != "PASS" ] || [ "${{ steps.validate.outcome }}" = "failure" ]; then
              echo "- This PR is generated for editor review only. Resolve \`newsroom/${DATE}/fact-check-report.md\`, \`newsroom/${DATE}/quality-report.md\`, and validation failures before publishing."
            fi
            echo ""
            echo "## Generated Artifacts"
            echo ""
            echo "- \`collected-news/${DATE}/candidates.json\`"
            echo "- \`newsroom/${DATE}/shortlisted-candidates.json\`"
            echo "- \`newsroom/${DATE}/reporter-candidates.json\`"
            echo "- \`newsroom/${DATE}/editor-draft.json\`"
            echo "- \`newsroom/${DATE}/fact-check-report.json\`"
            echo "- \`newsroom/${DATE}/quality-report.json\`"
            echo "- \`newsroom/${DATE}/quality-report.md\`"
            echo "- \`newsroom/${DATE}/retry-history.json\`"
            echo "- \`newsroom/${DATE}/retry-history.md\`"
            echo "- \`newsroom/${DATE}/recovery-prompt.md\` (only when recovery is needed)"
            echo "- \`newsletters/${DATE}/newsletter.md\`"
            echo "- \`newsletters/${DATE}/index.html\`"
            echo "- \`data/newsletters.json\`"
            echo ""
            echo "This PR is generated by Gemini newsroom automation and is not auto-merged."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure labels
        if: steps.generate.outcome == 'success'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = [
              { name: 'newsletter', color: '1b58b5', description: 'Camera HAL SW Newsletter' },
              { name: 'editor-review', color: 'fbca04', description: 'Editor-in-chief review required' },
              { name: 'needs-fix', color: 'd73a4a', description: 'Generated newsletter is not ready to publish' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

      - name: Create pull request
        id: cpr
        if: steps.generate.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Generate Camera HAL newsletter ${{ steps.meta.outputs.date }}"
          branch: ${{ steps.meta.outputs.branch }}
          delete-branch: true
          title: "[Newsletter] Camera HAL SW Newsletter - ${{ steps.meta.outputs.date }}"
          body: ${{ steps.pr-body.outputs.body }}

      - name: Add pull request labels
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = ['newsletter', 'editor-review'];
            if ('${{ steps.generation-status.outputs.status }}' !== 'PASS' || '${{ steps.validate.outcome }}' !== 'success') {
              labels.push('needs-fix');
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.cpr.outputs.pull-request-number }}'),
              labels
            });

      - name: Upload newsroom debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-debug-${{ github.run_id }}
          path: .tmp/artifact-snapshot
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if generation, validation, fact check, quality gate, or thin-week readiness failed
        if: steps.generate.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.generation-status.outputs.status == 'NEEDS_FIX' || steps.generation-status.outputs.status == 'QUALITY_NEEDS_FIX' || steps.generation-status.outputs.status == 'UNDERFILLED_NEEDS_FIX' || steps.generation-status.outputs.publish_ready != 'true'
        run: |
          echo "Gemini generation, site validation, fact-check, quality gate, or thin-week readiness failed. Review the generated PR artifacts and workflow logs."
          exit 1
