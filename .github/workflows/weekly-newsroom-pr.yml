name: Weekly Gemini Newsroom PR

on:
  schedule:
    - cron: "0 0 * * *" # KST daily 09:00
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
      lookback_days:
        description: "How many days to look back when collecting news candidates."
        required: false
        default: "21"
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-gemini-newsroom-pr
  cancel-in-progress: false

jobs:
  create-newsroom-pr:
    runs-on: ubuntu-latest

    env:
      NEWSLETTER_DATE: ${{ github.event.inputs.newsletter_date }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '21' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-2.5-flash-lite,gemini-3.1-flash-lite-preview' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Jitter scheduled run
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( RANDOM % 300 ))
          echo "Sleeping ${DELAY}s to avoid fixed-minute API demand spikes."
          sleep "${DELAY}"

      - name: Collect news candidates
        run: npm run collect

      - name: Generate newsletter with Gemini newsroom
        id: generate
        continue-on-error: true
        run: npm run generate

      - name: Validate generated site
        id: validate
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          REQUIRE_NEWSLETTER_DATE_FILE: "1"
        run: npm run validate

      - name: Resolve newsletter metadata
        id: meta
        if: steps.generate.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          DATE=$(cat .tmp/newsletter-date.txt)
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=newsletter/${DATE}" >> "$GITHUB_OUTPUT"

      - name: Resolve generation status
        id: generation-status
        if: steps.generate.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const statusPath = '.tmp/newsletter-generation-status.json';
          const status = fs.existsSync(statusPath)
            ? JSON.parse(fs.readFileSync(statusPath, 'utf8'))
            : { status: 'UNKNOWN', must_fix_count: 0 };
          console.log(`status=${status.status || 'UNKNOWN'}`);
          console.log(`must_fix_count=${status.must_fix_count || 0}`);
          NODE

      - name: Prepare pull request body
        id: pr-body
        if: steps.generate.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          {
            echo "body<<EOF"
            cat "newsroom/${DATE}/editor-in-chief-brief.md"
            echo ""
            echo "## Generation Status"
            echo ""
            echo "- Status: \`${{ steps.generation-status.outputs.status }}\`"
            echo "- Fact-check must-fix count: \`${{ steps.generation-status.outputs.must_fix_count }}\`"
            if [ "${{ steps.generation-status.outputs.status }}" = "NEEDS_FIX" ]; then
              echo "- This PR is generated for editor review only. Resolve \`newsroom/${DATE}/fact-check-report.md\` before publishing."
            fi
            echo ""
            echo "## Generated Artifacts"
            echo ""
            echo "- \`collected-news/${DATE}/candidates.json\`"
            echo "- \`newsroom/${DATE}/reporter-candidates.json\`"
            echo "- \`newsroom/${DATE}/editor-draft.json\`"
            echo "- \`newsroom/${DATE}/fact-check-report.json\`"
            echo "- \`newsletters/${DATE}/newsletter.md\`"
            echo "- \`newsletters/${DATE}/index.html\`"
            echo "- \`data/newsletters.json\`"
            echo ""
            echo "This PR is generated by Gemini newsroom automation and is not auto-merged."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure labels
        if: steps.generate.outcome == 'success' && steps.validate.outcome == 'success'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = [
              { name: 'newsletter', color: '1b58b5', description: 'Camera HAL SW Newsletter' },
              { name: 'editor-review', color: 'fbca04', description: 'Editor-in-chief review required' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

      - name: Create pull request
        id: cpr
        if: steps.generate.outcome == 'success' && steps.validate.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Generate Camera HAL newsletter ${{ steps.meta.outputs.date }}"
          branch: ${{ steps.meta.outputs.branch }}
          delete-branch: true
          title: "[Newsletter] Camera HAL SW Newsletter - ${{ steps.meta.outputs.date }}"
          body: ${{ steps.pr-body.outputs.body }}

      - name: Add pull request labels
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.cpr.outputs.pull-request-number }}'),
              labels: ['newsletter', 'editor-review']
            });

      - name: Fail if generation, validation, or fact check failed
        if: steps.generate.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.generation-status.outputs.status == 'NEEDS_FIX'
        run: |
          echo "Gemini generation, site validation, or fact-check gate failed. Review the generated PR artifacts and workflow logs."
          exit 1
