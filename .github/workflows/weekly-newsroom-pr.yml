name: Weekly Gemini Newsroom PR

on:
  schedule:
    - cron: "0 0 * * *" # KST daily 09:00
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
      lookback_days:
        description: "How many days to look back when collecting news candidates."
        required: false
        default: "21"
        type: string
      allow_pro:
        description: "Allow Gemini Pro for this manual run."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-gemini-newsroom-pr
  cancel-in-progress: false

jobs:
  create-newsroom-pr:
    runs-on: ubuntu-latest

    env:
      NEWSLETTER_DATE: ${{ github.event.inputs.newsletter_date }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '21' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      GEMINI_FALLBACK_MODELS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_pro == 'true' && format('{0},gemini-2.5-pro', vars.GEMINI_FALLBACK_MODELS || 'gemini-2.5-flash-lite') || vars.GEMINI_FALLBACK_MODELS || 'gemini-2.5-flash-lite' }}
      GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES || '2' }}
      GEMINI_RETRY_DELAYS_MS: ${{ vars.GEMINI_RETRY_DELAYS_MS || '20000,10000' }}
      GEMINI_RETRY_MAX_DELAY_MS: ${{ vars.GEMINI_RETRY_MAX_DELAY_MS || '300000' }}
      GEMINI_THINKING_BUDGET_REPORTER: ${{ vars.GEMINI_THINKING_BUDGET_REPORTER || '0' }}
      GEMINI_THINKING_BUDGET_EDITOR: ${{ vars.GEMINI_THINKING_BUDGET_EDITOR || '512' }}
      GEMINI_THINKING_BUDGET_REPAIR: ${{ vars.GEMINI_THINKING_BUDGET_REPAIR || '0' }}
      GEMINI_THINKING_BUDGET_FACTCHECK: ${{ vars.GEMINI_THINKING_BUDGET_FACTCHECK || '0' }}
      GEMINI_THINKING_BUDGET_SCORING: ${{ vars.GEMINI_THINKING_BUDGET_SCORING || '0' }}
      NEWSROOM_MAX_QUALITY_RETRIES: ${{ vars.NEWSROOM_MAX_QUALITY_RETRIES || '1' }}
      NEWSROOM_MAX_SECTION_REPAIRS: ${{ vars.NEWSROOM_MAX_SECTION_REPAIRS || '1' }}
      NEWSROOM_WARN_COST_USD: ${{ vars.NEWSROOM_WARN_COST_USD || '0.15' }}
      NEWSROOM_MAX_COST_USD: ${{ vars.NEWSROOM_MAX_COST_USD || '0.25' }}
      NEWSROOM_ALLOW_PRO_ON_SCHEDULE: ${{ vars.NEWSROOM_ALLOW_PRO_ON_SCHEDULE || 'false' }}
      NEWSROOM_ALLOW_PRO_ON_MANUAL: ${{ github.event.inputs.allow_pro || 'false' }}
      NEWSROOM_PRO_ESCALATION: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Doctor runtime config
        run: npm run doctor:config

      - name: Jitter scheduled run
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( RANDOM % 300 ))
          echo "Sleeping ${DELAY}s to avoid fixed-minute API demand spikes."
          sleep "${DELAY}"

      - name: Collect news candidates
        run: npm run collect

      - name: Restore URL summary cache
        uses: actions/cache@v4
        with:
          path: cache/news-summary
          key: news-summary-${{ runner.os }}-${{ hashFiles('content/collected-news/**/candidates.json') }}
          restore-keys: |
            news-summary-${{ runner.os }}-

      - name: Generate newsletter with Gemini newsroom
        id: generate
        continue-on-error: true
        run: npm run generate

      - name: Resolve newsletter metadata
        id: meta
        if: always()
        run: |
          if [ -f .tmp/newsletter-date.txt ]; then
            DATE=$(cat .tmp/newsletter-date.txt)
          elif [ -n "${NEWSLETTER_DATE:-}" ]; then
            DATE="${NEWSLETTER_DATE}"
          else
            DATE=$(TZ=Asia/Seoul date +%F)
          fi

          HAS_REVIEWABLE_ARTIFACTS="false"
          if [ -f ".tmp/newsletter-date.txt" ] && [ -d "content/newsroom/${DATE}" ]; then
            if [ -f "content/newsroom/${DATE}/editor-draft.json" ] || [ -f "newsletters/${DATE}/newsletter.md" ]; then
              HAS_REVIEWABLE_ARTIFACTS="true"
            fi
          fi

          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=newsletter/${DATE}" >> "$GITHUB_OUTPUT"
          echo "has_reviewable_artifacts=${HAS_REVIEWABLE_ARTIFACTS}" >> "$GITHUB_OUTPUT"

      - name: Resolve generation status
        id: generation-status
        if: always()
        run: node scripts/write-generation-status-output.js >> "$GITHUB_OUTPUT"

      - name: Validate generated site
        id: validate
        if: steps.meta.outputs.has_reviewable_artifacts == 'true'
        continue-on-error: true
        env:
          REQUIRE_NEWSLETTER_DATE_FILE: "1"
        run: npm run validate

      - name: Snapshot newsroom debug artifacts
        if: always()
        run: |
          set -euo pipefail

          SNAPSHOT=".tmp/artifact-snapshot"
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"

          HAS_GENERATED_DATE="0"
          if [ -f .tmp/newsletter-date.txt ]; then
            DATE=$(cat .tmp/newsletter-date.txt)
            HAS_GENERATED_DATE="1"
          elif [ -n "${NEWSLETTER_DATE:-}" ]; then
            DATE="${NEWSLETTER_DATE}"
          else
            DATE=$(TZ=Asia/Seoul date +%F)
          fi

          copy_if_present() {
            local src="$1"
            local dest="$SNAPSHOT/$src"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dest")"
              cp "$src" "$dest"
            fi
          }

          copy_tree_if_present() {
            local src="$1"
            local dest="$SNAPSHOT/$src"
            if [ -d "$src" ]; then
              mkdir -p "$(dirname "$dest")"
              cp -R "$src" "$dest"
            fi
          }

          copy_if_present ".tmp/newsletter-date.txt"
          copy_if_present ".tmp/newsletter-generation-status.json"
          copy_if_present ".tmp/newsroom-cost-report.json"
          copy_if_present ".tmp/summary-cache-report.json"
          copy_tree_if_present ".tmp/gemini-raw"
          copy_tree_if_present "cache/news-summary"
          if [ "$HAS_GENERATED_DATE" = "1" ]; then
            copy_if_present "content/collected-news/${DATE}/candidates.json"
            copy_tree_if_present "content/newsroom/${DATE}"
            copy_if_present "newsletters/${DATE}/newsletter.md"
            copy_if_present "newsletters/${DATE}/index.html"
            copy_if_present "data/newsletters.json"
          else
            echo "No generated .tmp/newsletter-date.txt found; skipping date-scoped artifact copy to avoid stale base-branch files."
          fi

          node scripts/write-artifact-manifest.js "$SNAPSHOT" "$DATE"

      - name: Prepare pull request body
        id: pr-body
        if: steps.meta.outputs.has_reviewable_artifacts == 'true'
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome || 'skipped' }}
        run: |
          {
            echo "body<<EOF"
            node scripts/build-newsroom-pr-body.js
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure labels
        if: steps.meta.outputs.has_reviewable_artifacts == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = [
              { name: 'newsletter', color: '1b58b5', description: 'Camera HAL SW Newsletter' },
              { name: 'editor-review', color: 'fbca04', description: 'Editor-in-chief review required' },
              { name: 'needs-fix', color: 'd73a4a', description: 'Generated newsletter is not ready to publish' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

      - name: Create pull request
        id: cpr
        if: steps.meta.outputs.has_reviewable_artifacts == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Generate Camera HAL newsletter ${{ steps.meta.outputs.date }}"
          branch: ${{ steps.meta.outputs.branch }}
          delete-branch: true
          title: "[Newsletter] Camera HAL SW Newsletter - ${{ steps.meta.outputs.date }}"
          body: ${{ steps.pr-body.outputs.body }}

      - name: Add pull request labels
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = ['newsletter', 'editor-review'];
            if ('${{ steps.generation-status.outputs.status }}' !== 'PASS' || '${{ steps.validate.outcome }}' !== 'success') {
              labels.push('needs-fix');
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.cpr.outputs.pull-request-number }}'),
              labels
            });

      - name: Upload newsroom debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-debug-${{ github.run_id }}
          path: .tmp/artifact-snapshot
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if generation, validation, fact check, quality gate, or thin-week readiness failed
        if: steps.generate.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.generation-status.outputs.status == 'NEEDS_FIX' || steps.generation-status.outputs.status == 'QUALITY_NEEDS_FIX' || steps.generation-status.outputs.status == 'UNDERFILLED_NEEDS_FIX' || steps.generation-status.outputs.quality_status == 'NEEDS_FIX' || steps.generation-status.outputs.publish_ready != 'true' || fromJSON(steps.generation-status.outputs.final_selected_article_count_for_gate) < 4
        run: |
          echo "Gemini generation, site validation, fact-check, quality gate, or thin-week readiness failed. Review the generated PR artifacts and workflow logs."
          exit 1
