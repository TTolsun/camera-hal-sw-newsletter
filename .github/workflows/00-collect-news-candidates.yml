name: 00 - Collect News Candidates

on:
  schedule:
    - cron: "0 21 * * 0" # KST Monday 06:00
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
      lookback_days:
        description: "How many days to look back when collecting news candidates."
        required: false
        default: "21"
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: collect-news-candidates
  cancel-in-progress: false

jobs:
  collect-news-candidates:
    runs-on: ubuntu-latest

    env:
      NEWSLETTER_DATE: ${{ github.event.inputs.newsletter_date }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '21' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect news candidates without OpenAI API
        run: |
          node scripts/collect-news-candidates.js

      - name: Resolve candidate date
        id: meta
        run: |
          DATE=$(cat .tmp/news-candidate-date.txt)
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=news-candidates/${DATE}" >> "$GITHUB_OUTPUT"

      - name: Create or update candidate branch
        run: |
          BRANCH="${{ steps.meta.outputs.branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add collected-news/ newsroom/

          if git diff --cached --quiet; then
            echo "No candidate changes."
            exit 0
          fi

          git commit -m "Collect news candidates ${{ steps.meta.outputs.date }}"
          git push --force-with-lease origin "$BRANCH"

      - name: Create or update candidate issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = '${{ steps.meta.outputs.date }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `[News Candidates] Camera HAL SW Newsletter - ${date}`;
            const bodyPath = `newsroom/${date}/news-candidates.md`;
            const body = fs.readFileSync(bodyPath, 'utf8');
            const labels = ['newsletter', 'news-candidates'];

            async function ensureLabels() {
              for (const label of labels) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: label });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color: label === 'newsletter' ? '0e8a16' : '1d76db',
                    description: label === 'newsletter'
                      ? 'Newsletter operation'
                      : 'Automatically collected news candidates'
                  });
                }
              }
            }

            await ensureLabels();

            const issues = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}"`,
              per_page: 5
            });

            if (issues.data.items.length > 0) {
              const issue = issues.data.items[0];
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                title,
                body,
                labels
              });
              core.info(`Updated existing issue #${issue.number}`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels
            });

            core.info(`Created issue #${issue.data.number}`);

      - name: Create or update candidate pull request
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.meta.outputs.date }}';
            const branch = '${{ steps.meta.outputs.branch }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `[News Candidates] Collect Camera HAL SW news candidates - ${date}`;
            const labels = ['newsletter', 'news-candidates'];

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main',
              per_page: 10
            });

            const body = [
              '## Summary',
              '',
              `무료 수집 스크립트가 ${date} 뉴스 후보를 수집했습니다. OpenAI API는 사용하지 않았습니다.`,
              '',
              '## Workflow Roles',
              '',
              '- [x] 기자: GitHub Action `collect-news-candidates.js`',
              '- [ ] 편집자: ChatGPT에서 후보 기반 뉴스레터 작성',
              '- [ ] 편집장: 김경환 최종 후보 선택',
              '- [ ] 검수자: `02 - Validate Site`는 최종 발행 PR에서 실행',
              '- [ ] 업데이터: `01 - Manual Newsletter Publish`에서 최종 뉴스레터 등록',
              '',
              '## Updated Files',
              '',
              `- collected-news/${date}/candidates.json`,
              `- newsroom/${date}/news-candidates.md`,
              '',
              '## Next Step',
              '',
              '1. 생성된 Issue의 후보 목록을 ChatGPT에 붙여넣습니다.',
              '2. ChatGPT에서 `newsletter.md`와 `index.html`을 작성합니다.',
              '3. `newsletters/YYYY-MM-DD/`에 결과물을 저장합니다.',
              '4. `01 - Manual Newsletter Publish`를 실행해서 최종 발행 PR을 만듭니다.',
              '',
              '이 PR은 후보 보관용입니다. 최종 뉴스레터 발행 PR이 아닙니다.'
            ].join('\n');

            if (prs.data.length > 0) {
              const pr = prs.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body
              });
              await github.rest.issues.setLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels
              });
              core.info(`Updated existing PR #${pr.number}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title,
              body,
              head: branch,
              base: 'main',
              draft: false
            });

            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number: pr.data.number,
              labels
            });

            core.info(`Created PR #${pr.data.number}`);
