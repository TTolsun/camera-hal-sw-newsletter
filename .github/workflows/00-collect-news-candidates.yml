name: 00 - Collect News Candidates

on:
  schedule:
    - cron: "0 21 * * 0" # KST Monday 06:00
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
      lookback_days:
        description: "How many days to look back when collecting news candidates."
        required: false
        default: "21"
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: collect-news-candidates
  cancel-in-progress: false

jobs:
  collect-news-candidates:
    runs-on: ubuntu-latest

    env:
      NEWSLETTER_DATE: ${{ github.event.inputs.newsletter_date }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '21' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect news candidates without OpenAI API
        run: |
          node scripts/collect-news-candidates.js

      - name: Resolve candidate date
        id: meta
        run: |
          DATE=$(cat .tmp/news-candidate-date.txt)
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=news-candidates/${DATE}" >> "$GITHUB_OUTPUT"

      - name: Create or update candidate branch
        run: |
          BRANCH="${{ steps.meta.outputs.branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add collected-news/ newsroom/

          if git diff --cached --quiet; then
            echo "No candidate changes."
            exit 0
          fi

          git commit -m "Collect news candidates ${{ steps.meta.outputs.date }}"
          git push --force-with-lease origin "$BRANCH"

      - name: Create or update candidate issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = '${{ steps.meta.outputs.date }}';
            const branch = '${{ steps.meta.outputs.branch }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `[News Candidates] Camera HAL SW Newsletter - ${date}`;
            const bodyPath = `newsroom/${date}/news-candidates.md`;
            const candidateBody = fs.readFileSync(bodyPath, 'utf8');
            const labels = ['newsletter', 'news-candidates'];
            const branchUrl = `https://github.com/${owner}/${repo}/tree/${branch}`;
            const compareUrl = `https://github.com/${owner}/${repo}/compare/main...${branch}`;

            async function ensureLabels() {
              for (const label of labels) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: label });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label,
                    color: label === 'newsletter' ? '0e8a16' : '1d76db',
                    description: label === 'newsletter'
                      ? 'Newsletter operation'
                      : 'Automatically collected news candidates'
                  });
                }
              }
            }

            await ensureLabels();

            const body = [
              candidateBody,
              '',
              '## GitHub Action Output',
              '',
              `- Candidate branch: [${branch}](${branchUrl})`,
              `- Compare with main: [main...${branch}](${compareUrl})`,
              '',
              '## Why there is no automatic PR',
              '',
              '이 저장소 설정에서는 GitHub Actions가 Pull Request를 직접 생성할 수 없습니다.',
              '그래서 후보 수집 workflow는 Issue와 후보 branch까지만 생성합니다.',
              '최종 뉴스레터 발행은 `01 - Manual Newsletter Publish` workflow에서 처리합니다.'
            ].join('\n');

            const issues = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}"`,
              per_page: 5
            });

            if (issues.data.items.length > 0) {
              const issue = issues.data.items[0];
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                title,
                body,
                labels
              });
              core.info(`Updated existing issue #${issue.number}`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels
            });

            core.info(`Created issue #${issue.data.number}`);
