name: Site 02 - Build & Deploy (GitHub Pages)

# #262 phase 6: 공개 출력물은 root index.html + articles/ 아래에 위치한다.
# 이 워크플로는 _site/ = (root index.html) + (articles/* 를 _site 루트로 복사)로 조립해
# Pages Actions로 배포하므로 서빙 URL(/, /newsletters/..., /css/..., /assets/...,
# /data/newsletters.json, /sitemap.xml, /robots.txt, /archive.html, /content/...)이 보존된다.
#
# build/deploy 2-job 분리: assemble+upload은 build에서 한 번만 수행하고 deploy는 그 아티팩트만
# 배포한다. 그래서 GitHub Pages 백엔드 일시장애로 deploy가 실패해도 `rerun --failed`가 deploy
# job만 다시 돌려 기존 아티팩트를 재사용한다 — 단일 job이 재-upload해 "github-pages" 아티팩트가
# 2개가 되던(Multiple artifacts) footgun을 없앤다.
#
# NOTE: 이 워크플로는 운영자가 GitHub Pages source를 "GitHub Actions"로 전환한 뒤에만 발행한다.

on:
  push:
    branches: ["main"]
    # 조립기가 _site로 복사하는 서빙 파일(assemble-site.js의 EXTRA_SERVED_FILES)과 그 복사 목록을
    # 정하는 조립기 스크립트 자체도 트리거에 포함한다. 빠지면 그 파일만 바꾼 머지가 배포를 깨우지
    # 못해 다음 articles/** 머지(사실상 다음 주 뉴스레터)까지 라이브에 반영되지 않는다.
    # 이 목록과 EXTRA_SERVED_FILES의 정합성은 site-02-deploy-workflow.test.js가 강제한다.
    paths:
      - "index.html"
      - "articles/**"
      - "config/subscription.json"
      - "src/generator/publish/assemble-site.js"
      - ".github/workflows/site-02-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assemble static site into _site
        run: node src/generator/publish/assemble-site.js --out _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
