name: Newsletters 03 - Editor PR

on:
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        default: ""
        type: string
      llm_provider:
        description: "LLM provider override for manual runs. Current code default: Gemini. Choices: default(code default), gemini, openapi(reserved fail-fast)."
        required: false
        default: "default"
        type: choice
        options:
          - "default"
          - "gemini"
          - "openapi"
      llm_model:
        description: "Optional LLM model override for this manual run."
        required: false
        default: ""
        type: string
      llm_fallback_models:
        description: "Optional comma-separated fallback model override for this manual run."
        required: false
        default: ""
        type: string
      coverage_week_key:
        description: "Coverage 주 override, 형식 YYYY-Www(예: 2026-W34). 비우면 실행일 기준 자동 계산."
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
        default: ""
      coverage_week_key:
        description: "Coverage 주 override, 형식 YYYY-Www. 비우면 실행일 기준 자동 계산."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: newsroom-final-${{ inputs.newsletter_date || github.event.inputs.newsletter_date || 'auto-kst-today' }}
  cancel-in-progress: false

jobs:
  create-final-newsletter-pr:
    runs-on: ubuntu-latest

    env:
      NEWSLETTER_DATE: ${{ inputs.newsletter_date || github.event.inputs.newsletter_date || '' }}
      NEWSROOM_CANDIDATE_INPUT_MODE: artifact
      NEWSROOM_CANDIDATE_INPUT_PATH: ""
      # Task 12: generate(npm run generate → gemini-newsroom-newsletter.js)가 shortlist/최종
      # 후보를 select 체인으로 다시 계산하며 이 override를 coverage 앵커로 쓴다
      # (newsroom-selection.js). collect(01)와 같은 값을 못 받으면 같은 주 안에서 서로 다른
      # 대상 주를 계산해 weekly upsert hard-fail(Task 11)을 오탐시킬 수 있다.
      # CARRY_SOURCE_PATH는 여기서 전달하지 않는다 — carry-forward 로딩은 collect(01) 단계의
      # collect-news-candidates.js에서만 일어나고, 이 워크플로는 그 호출부를 갖지 않는다.
      COVERAGE_WEEK_KEY: ${{ inputs.coverage_week_key || github.event.inputs.coverage_week_key || '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES || '2' }}
      GEMINI_RETRY_DELAYS_MS: ${{ vars.GEMINI_RETRY_DELAYS_MS || '20000,10000' }}
      GEMINI_RETRY_MAX_DELAY_MS: ${{ vars.GEMINI_RETRY_MAX_DELAY_MS || '300000' }}
      # thinking budget은 코드 기본값(runtime-config.js DEFAULT_RUNTIME_CONFIG)을 단일 정본으로 둔다.
      # 빈 문자열이면 코드 기본값으로 해석됨(parseInteger defaultOnEmpty). repo vars로만 override.
      GEMINI_THINKING_BUDGET_REPORTER: ${{ vars.GEMINI_THINKING_BUDGET_REPORTER || '' }}
      GEMINI_THINKING_BUDGET_EDITOR: ${{ vars.GEMINI_THINKING_BUDGET_EDITOR || '' }}
      GEMINI_THINKING_BUDGET_REPAIR: ${{ vars.GEMINI_THINKING_BUDGET_REPAIR || '' }}
      GEMINI_THINKING_BUDGET_FACTCHECK: ${{ vars.GEMINI_THINKING_BUDGET_FACTCHECK || '' }}
      GEMINI_THINKING_BUDGET_JUDGE: ${{ vars.GEMINI_THINKING_BUDGET_JUDGE || '' }}
      GEMINI_THINKING_BUDGET_SCORING: ${{ vars.GEMINI_THINKING_BUDGET_SCORING || '' }}
      NEWSROOM_REPORTER_MODEL: ${{ vars.NEWSROOM_REPORTER_MODEL || '' }}
      NEWSROOM_EDITOR_MODEL: ${{ vars.NEWSROOM_EDITOR_MODEL || '' }}
      NEWSROOM_FACTCHECK_MODEL: ${{ vars.NEWSROOM_FACTCHECK_MODEL || '' }}
      NEWSROOM_REPAIR_MODEL: ${{ vars.NEWSROOM_REPAIR_MODEL || '' }}
      NEWSROOM_JUDGE_MODEL: ${{ vars.NEWSROOM_JUDGE_MODEL || '' }}
      NEWSROOM_MAX_QUALITY_RETRIES: ${{ vars.NEWSROOM_MAX_QUALITY_RETRIES || '1' }}
      NEWSROOM_MAX_SECTION_REPAIRS: ${{ vars.NEWSROOM_MAX_SECTION_REPAIRS || '1' }}
      # 비용 임계값도 같은 규칙이다(#660). 빈 문자열이면 코드 기본값(parseNumber defaultOnEmpty).
      # 위 두 줄과 달리 리터럴 폴백을 두지 않는 이유는, 그 리터럴이 코드 기본값을 항상 이겨서
      # #574의 weekly 상향이 프로덕션에 도달하지 못했기 때문이다.
      NEWSROOM_WARN_COST_USD: ${{ vars.NEWSROOM_WARN_COST_USD || '' }}
      NEWSROOM_MAX_COST_USD: ${{ vars.NEWSROOM_MAX_COST_USD || '' }}
      NEWSROOM_BACKGROUND_CONTEXT_STAGE: ${{ vars.NEWSROOM_BACKGROUND_CONTEXT_STAGE || 'gemini' }}
      NEWSROOM_LINKED_EVIDENCE_MODE: ${{ vars.NEWSROOM_LINKED_EVIDENCE_MODE || 'extract_only' }}
      NEWSROOM_LINKED_EVIDENCE_MAX_LINKS_PER_CANDIDATE: ${{ vars.NEWSROOM_LINKED_EVIDENCE_MAX_LINKS_PER_CANDIDATE || '8' }}
      NEWSROOM_LINKED_EVIDENCE_MAX_LINKS_PER_RUN: ${{ vars.NEWSROOM_LINKED_EVIDENCE_MAX_LINKS_PER_RUN || '40' }}
      NEWSROOM_LINKED_EVIDENCE_TIMEOUT_MS: ${{ vars.NEWSROOM_LINKED_EVIDENCE_TIMEOUT_MS || '5000' }}
      NEWSROOM_LINKED_EVIDENCE_MAX_BYTES: ${{ vars.NEWSROOM_LINKED_EVIDENCE_MAX_BYTES || '200000' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve newsletter date
        id: resolve-newsletter-date
        env:
          INPUT_NEWSLETTER_DATE: ${{ inputs.newsletter_date || github.event.inputs.newsletter_date || '' }}
        run: |
          set -euo pipefail

          DATE="${INPUT_NEWSLETTER_DATE:-}"
          if [ -z "$DATE" ]; then
            DATE="$(TZ=Asia/Seoul date +%F)"
          fi

          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "newsletter_date must be YYYY-MM-DD: $DATE"
            exit 1
          fi

          echo "Newsletter date in YYYY-MM-DD. Empty means today in KST."
          echo "Resolved newsletter date: $DATE"
          echo "NEWSLETTER_DATE=$DATE" >> "$GITHUB_ENV"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply manual LLM overrides
        env:
          INPUT_LLM_PROVIDER: ${{ github.event.inputs.llm_provider }}
          INPUT_LLM_MODEL: ${{ github.event.inputs.llm_model }}
          INPUT_LLM_FALLBACK_MODELS: ${{ github.event.inputs.llm_fallback_models }}
        run: |
          set -euo pipefail

          for value in "${INPUT_LLM_PROVIDER:-}" "${INPUT_LLM_MODEL:-}" "${INPUT_LLM_FALLBACK_MODELS:-}"; do
            case "$value" in
              *$'\n'*|*$'\r'*)
                echo "Workflow inputs must be single-line values."
                exit 1
                ;;
            esac
          done

          if [ -n "${INPUT_LLM_PROVIDER:-}" ]; then
            echo "LLM_PROVIDER=${INPUT_LLM_PROVIDER}" >> "$GITHUB_ENV"
          fi
          if [ -n "${INPUT_LLM_MODEL:-}" ]; then
            echo "LLM_MODEL=${INPUT_LLM_MODEL}" >> "$GITHUB_ENV"
          fi
          if [ -n "${INPUT_LLM_FALLBACK_MODELS:-}" ]; then
            echo "LLM_FALLBACK_MODELS=${INPUT_LLM_FALLBACK_MODELS}" >> "$GITHUB_ENV"
          fi

      - name: Doctor runtime config
        run: npm run doctor:config

      - name: Validate newsletter policy
        run: npm run validate:policy

      - name: Check policy docs
        run: npm run check:policy-docs

      - name: Run unit and regression tests
        run: npm run test

      - name: Restore URL summary cache
        uses: actions/cache/restore@v4
        with:
          path: cache/news-summary
          key: news-summary-${{ runner.os }}-
          restore-keys: |
            news-summary-${{ runner.os }}-

      - name: Generate newsletter with approved candidate artifact
        id: generate
        continue-on-error: true
        run: npm run generate

      # Bind real article images before the publish-blocking image audit. The editor
      # leaves selectedImage empty when image rights/relevance are uncertain; this
      # deterministic repair binds the best valid imageCandidate per the audit rules
      # so a valid image is used when one exists. The local fallback visual is kept
      # only for articles that genuinely have no valid candidate.
      - name: Bind valid article images
        id: repair-images
        if: always() && steps.generate.outcome == 'success' && steps.resolve-newsletter-date.outputs.date != ''
        continue-on-error: true
        run: npm run newsroom:repair-images -- --date "${{ steps.resolve-newsletter-date.outputs.date }}"

      # generate(리뷰 패키지 writer)가 hal-signal-quality-report를 이미 생성하므로 이 스텝은
      # generate가 리뷰 패키지 작성 전에 죽은 crash-path의 진단 백필 전용이다. 이미 있는
      # 리포트를 재생성하면 generated_at만 바뀐 바이트가 artifact-manifest.json의 sha256과
      # 어긋난 채 커밋되므로 --skip-if-present로 막는다.
      - name: Generate HAL signal quality report
        if: always() && steps.resolve-newsletter-date.outputs.date != ''
        continue-on-error: true
        run: npm run report:hal-signal-quality -- --date "${{ steps.resolve-newsletter-date.outputs.date }}" --skip-if-present

      - name: Ensure public newsletter artifacts
        id: ensure-public-newsletter
        if: always()
        run: node src/generator/publish/ensure-public-newsletter-artifacts.js

      - name: Resolve newsletter metadata
        id: meta
        if: always()
        run: node src/generator/publish/resolve-reviewable-artifacts.js >> "$GITHUB_OUTPUT"

      - name: Resolve generation status
        id: generation-status
        if: always()
        run: node src/generator/publish/write-generation-status-output.js >> "$GITHUB_OUTPUT"

      - name: Check URL summary cache directory
        id: summary-cache
        if: always()
        run: |
          if [ -d cache/news-summary ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated site
        id: validate
        if: steps.meta.outputs.public_newsletter_ready == 'true'
        continue-on-error: true
        env:
          REQUIRE_NEWSLETTER_DATE_FILE: "1"
        run: npm run validate:post-generation

      - name: Resolve final publish status
        id: final-publish-status
        if: steps.meta.outputs.public_newsletter_ready == 'true'
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome || 'skipped' }}
        run: node src/generator/publish/write-publish-status-output.js >> "$GITHUB_OUTPUT"

      - name: Generate source effectiveness report
        if: always() && steps.meta.outputs.review_pr_ready == 'true'
        continue-on-error: true
        run: npm run report:source-effectiveness -- --date "${{ steps.meta.outputs.date }}"

      - name: Generate source quality diagnosis
        if: always() && steps.meta.outputs.date != ''
        continue-on-error: true
        run: npm run report:source-quality-diagnosis -- --date "${{ steps.meta.outputs.date }}"

      - name: Generate evidence pack summary
        if: always() && steps.meta.outputs.date != ''
        continue-on-error: true
        run: npm run report:evidence-pack -- --date "${{ steps.meta.outputs.date }}"

      - name: Audit newsletter image lineage
        id: audit-images
        if: always() && steps.meta.outputs.date != ''
        # 감사가 job을 죽이면 뒤의 PR 생성 스텝이 통째로 skip돼 그 주 뉴스레터 PR이 아예 생기지
        # 않는다(#886). 사라지는 것은 발행물이 아니라 사람이 판단할 리뷰 표면이라, 실패는 job이
        # 아니라 라벨로 드러낸다. 두 지점이 이 강등을 받쳐 준다.
        #  1) 아래 "Add pull request labels"가 이 스텝의 outcome을 읽어 publish-ready 라벨을 꺾는다.
        #  2) 머지 경로에서는 validate:images가 PR에 함께 커밋된 image-audit-report.json의
        #     publish 차단 카운트를 읽어 같은 조건을 차단한다.
        continue-on-error: true
        run: |
          if [ "${{ steps.meta.outputs.public_newsletter_ready }}" = "true" ]; then
            npm run newsroom:audit-images -- --date "${{ steps.meta.outputs.date }}" --fail-on-publish-blocking
          else
            npm run newsroom:audit-images -- --date "${{ steps.meta.outputs.date }}"
          fi

      - name: Snapshot newsroom debug artifacts
        if: always()
        run: |
          set -euo pipefail

          SNAPSHOT=".tmp/artifact-snapshot"
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT"

          DATE="${{ steps.meta.outputs.date }}"

          copy_if_present() {
            local src="$1"
            local dest="$SNAPSHOT/$src"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dest")"
              cp "$src" "$dest"
            fi
          }

          copy_tree_if_present() {
            local src="$1"
            local dest="$SNAPSHOT/$src"
            if [ -d "$src" ]; then
              mkdir -p "$(dirname "$dest")"
              cp -R "$src" "$dest"
            fi
          }

          copy_if_present ".tmp/newsletter-date.txt"
          copy_if_present ".tmp/newsletter-generation-status.json"
          copy_if_present ".tmp/newsroom-cost-report.json"
          copy_if_present ".tmp/summary-cache-report.json"
          copy_tree_if_present ".tmp/gemini-raw"
          copy_tree_if_present "cache/news-summary"
          if [ -n "$DATE" ]; then
            copy_if_present "articles/content/collected-news/${DATE}/manual-candidates.json"
            copy_if_present "articles/content/collected-news/${DATE}/candidates.json"
            copy_if_present "articles/content/collected-news/${DATE}/collection-intent.json"
            copy_if_present "articles/content/collected-news/${DATE}/seed-candidates.json"
            copy_if_present "articles/content/collected-news/${DATE}/seed-evidence-pack.json"
            copy_if_present "articles/content/collected-news/${DATE}/raw-candidate-manifest.json"
            copy_if_present "articles/content/collected-news/${DATE}/merged-candidates.json"
            copy_if_present "articles/content/collected-news/${DATE}/merged-candidate-manifest.json"
            copy_tree_if_present "articles/content/source-events/${DATE}"
            copy_tree_if_present "articles/content/newsroom/${DATE}"
            copy_if_present "articles/newsletters/${DATE}/newsletter.md"
            copy_if_present "articles/newsletters/${DATE}/index.html"
            copy_if_present "articles/data/newsletters.json"
            copy_if_present "articles/data/homepage-headline.json"
            copy_if_present "state/article-exposure-history.json"
            copy_if_present "state/deep-dive-topic-queue.json"
            copy_tree_if_present "state/source-snapshots"
          else
            echo "No generated date marker found; skipping date-scoped artifact copy."
          fi

          node src/generator/publish/write-artifact-manifest.js "$SNAPSHOT" "$DATE"

      - name: Save URL summary cache
        if: always() && steps.summary-cache.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: cache/news-summary
          key: news-summary-${{ runner.os }}-${{ steps.meta.outputs.date }}-${{ github.run_id }}

      - name: Prepare pull request body
        id: pr-body
        if: steps.meta.outputs.review_pr_ready == 'true'
        # 이미지 계보 감사 결과는 라벨과 PR 본문 양쪽이 같이 읽어야 하는 발행 게이트다(#896).
        # 본문이 감사 outcome을 모르면 needs-fix 라벨 밑에 publish-ready 판정 본문이 달린다.
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome || 'skipped' }}
          IMAGE_AUDIT_OUTCOME: ${{ steps.audit-images.outcome || 'skipped' }}
          HOMEPAGE_HEADLINE_FIGMA_URL: https://www.figma.com/design/EWJMa8vjfZLjdn9a7s3Kzs
          HOMEPAGE_HEADLINE_DESKTOP_COVERAGE: covered
          HOMEPAGE_HEADLINE_MOBILE_COVERAGE: covered
          HOMEPAGE_HEADLINE_IMPLEMENTATION_DEVIATION: none
        run: |
          mkdir -p .tmp
          node src/generator/publish/build-newsroom-pr-body.js > .tmp/newsroom-pr-body.md
          node src/generator/validate/validate-pr-body.js .tmp/newsroom-pr-body.md --type newsletter --date "${{ steps.meta.outputs.date }}" --require-publish-status-consistency
          {
            echo "body<<EOF"
            cat .tmp/newsroom-pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure labels
        if: steps.meta.outputs.review_pr_ready == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = [
              { name: 'newsletter', color: '1b58b5', description: 'Camera HAL / SW Newsletter' },
              { name: 'aosp-camera', color: '0e8a16', description: 'AOSP Camera and camera stack scope' },
              { name: 'editor-review', color: 'fbca04', description: 'Editor-in-chief review required' },
              { name: 'needs-fix', color: 'd73a4a', description: 'Generated newsletter is not ready to publish' },
              { name: 'fallback-composition', color: '5319e7', description: 'Non-publish-ready fallback composition diagnostics' },
              { name: 'thin-week', color: 'c5def5', description: 'Review-only thin-week newsletter candidate' },
              { name: 'review-only', color: 'bfd4f2', description: 'AI automatic publish gate did not pass; editor review is required' },
              { name: 'review-only-publication', color: 'bfd4f2', description: 'Public newsletter files exist but editor review is required before merge' },
              { name: 'diagnostics-only', color: 'cfd3d7', description: 'Review diagnostics only; merge will not publish a newsletter' },
              { name: 'failed-repair-reviewable', color: 'd4c5f9', description: 'Failed repair produced reviewable diagnostics' },
              { name: 'publish-ready', color: '0e8a16', description: 'Final publish gate passed' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

      - name: Resolve PR commit allowlist
        id: allowlist
        if: steps.meta.outputs.review_pr_ready == 'true'
        run: |
          set -euo pipefail
          PATHS="$(node src/generator/publish/print-retention-commit-allowlist.js --date "${{ steps.meta.outputs.date }}" --root .)"
          {
            echo "paths<<EOF"
            echo "$PATHS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create final newsletter pull request
        id: cpr
        if: steps.meta.outputs.review_pr_ready == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # 기본 GITHUB_TOKEN으로 만든 PR에는 GitHub이 validate-site 같은
          # on: pull_request 워크플로를 자동 실행하지 않는다(재귀 방지). 그래서
          # 검증 게이트가 매주 action_required 상태로 멈춘다. 별도 자격증명
          # NEWSROOM_PR_TOKEN(fine-grained PAT 또는 GitHub App token)이 있으면
          # 그것으로 PR을 만들어 검증이 자동 실행되게 한다. secret이 없으면
          # 기존 동작(GITHUB_TOKEN)으로 안전하게 폴백한다.
          token: ${{ secrets.NEWSROOM_PR_TOKEN || github.token }}
          commit-message: "Generate Camera HAL newsletter ${{ steps.meta.outputs.date }}"
          branch: newsroom-final/${{ steps.meta.outputs.date }}
          base: main
          delete-branch: true
          title: "[Newsletter] Camera HAL / SW Newsletter - ${{ steps.meta.outputs.date }}"
          body: ${{ steps.pr-body.outputs.body }}
          add-paths: ${{ steps.allowlist.outputs.paths }}

      - name: Add pull request labels
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const issue_number = Number('${{ steps.cpr.outputs.pull-request-number }}');
            const stateLabels = ['publish-ready', 'needs-fix', 'fallback-composition', 'thin-week', 'review-only', 'review-only-publication', 'diagnostics-only', 'failed-repair-reviewable'];
            const labels = ['newsletter', 'aosp-camera'];
            // 명시적 success만 통과다. skipped·cancelled를 통과로 치면 감사가 돌지 않은 주에도
            // publish-ready가 붙을 수 있다.
            const imageAuditPassed = '${{ steps.audit-images.outcome }}' === 'success';
            const hasAiPublishReady = '${{ steps.final-publish-status.outputs.has_ai_publish_ready }}' === 'true' && imageAuditPassed;
            const compositionMode = '${{ steps.final-publish-status.outputs.composition_mode }}';
            const diagnosticsOnly = '${{ steps.meta.outputs.diagnostics_only }}' === 'true';
            // review-only-publication은 "공개 파일이 준비돼 있어 편집장이 merge하면 Pages에 뜬다"는
            // 뜻이다(.github/workflows/AGENTS.md). meta의 review_publication_ready는 감사보다 먼저
            // 계산되고 final_publish_ready=false까지 요구해서, 감사 강등 주에는 이 분기가 통째로
            // 빠졌다(#896). 라벨 정의 그대로 공개 파일 존재 여부로 판정한다. diagnostics_only는
            // 정의상 공개 파일이 없을 때만 참이므로 두 라벨은 여전히 동시에 붙지 않는다.
            const publicNewsletterReady = '${{ steps.meta.outputs.public_newsletter_ready }}' === 'true';
            const generationStatus = '${{ steps.generation-status.outputs.status }}';
            if (hasAiPublishReady) {
              labels.push('publish-ready');
            } else if (publicNewsletterReady) {
              labels.push('needs-fix', 'editor-review', 'review-only', 'review-only-publication');
            } else if (diagnosticsOnly) {
              labels.push('needs-fix', 'editor-review', 'review-only', 'diagnostics-only');
              if (generationStatus === 'FAILED_REPAIR_REVIEWABLE') {
                labels.push('failed-repair-reviewable');
              }
            } else {
              labels.push('needs-fix', 'editor-review');
            }
            if (compositionMode === 'FALLBACK_COMPOSITION' && !hasAiPublishReady) {
              labels.push('fallback-composition');
            }
            if (compositionMode === 'THIN_WEEK_REVIEW') {
              labels.push('thin-week');
            }
            for (const name of stateLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels
            });

      - name: Upload newsroom debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-final-debug-${{ github.run_id }}
          path: .tmp/artifact-snapshot
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Write workflow run summary
        if: always()
        continue-on-error: true
        env:
          SUMMARY_PROFILE: newsroom-final
          OUTCOME_GENERATE: ${{ steps.generate.outcome }}
          OUTCOME_ENSURE_PUBLIC: ${{ steps.ensure-public-newsletter.outcome }}
          OUTCOME_VALIDATE: ${{ steps.validate.outcome || 'skipped' }}
          PUBLIC_NEWSLETTER_READY: ${{ steps.meta.outputs.public_newsletter_ready }}
          PUBLIC_NEWSLETTER_REASON: ${{ steps.meta.outputs.public_newsletter_reason }}
          REVIEW_PR_READY: ${{ steps.meta.outputs.review_pr_ready }}
          REVIEWABLE_ARTIFACT_REASON: ${{ steps.meta.outputs.reviewable_artifact_reason }}
          DIAGNOSTICS_ONLY: ${{ steps.meta.outputs.diagnostics_only }}
          GENERATION_STATUS: ${{ steps.generation-status.outputs.status }}
          HAS_AI_PUBLISH_READY: ${{ steps.final-publish-status.outputs.has_ai_publish_ready }}
          # has_ai_publish_ready는 audit-images보다 먼저 도는 스텝 출력이라 감사를 모른다. 라벨
          # 스텝과 같은 신호를 줘야 summary·라벨·PR 본문 세 표면이 같은 말을 한다(#896).
          IMAGE_AUDIT_OUTCOME: ${{ steps.audit-images.outcome || 'skipped' }}
          COMPOSITION_MODE: ${{ steps.final-publish-status.outputs.composition_mode }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          NEWSLETTER_DATE: ${{ steps.meta.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEBUG_ARTIFACT_NAME: newsroom-final-debug-${{ github.run_id }}
        run: node src/shared/tooling/cli/write-newsroom-workflow-summary.js --profile "$SUMMARY_PROFILE"

      - name: Fail if no reviewable PR can be created
        if: steps.meta.outputs.review_pr_ready != 'true'
        run: |
          echo "Newsletter artifacts are not reviewable: ${{ steps.meta.outputs.reviewable_artifact_reason }}"
          echo "Public newsletter readiness: ${{ steps.meta.outputs.public_newsletter_ready }}"
          echo "Public newsletter reason: ${{ steps.meta.outputs.public_newsletter_reason }}"
          exit 1
