name: Weekly Newsletter Update

on:
  schedule:
    # KST Monday 07:10 = UTC Sunday 22:10
    - cron: "10 22 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "Newsletter date in YYYY-MM-DD. Defaults to today in KST."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-newsletter-update
  cancel-in-progress: false

jobs:
  update-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate weekly newsletter files
        env:
          NEWSLETTER_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const manualDate = (process.env.NEWSLETTER_DATE || '').trim();
          const datePattern = /^\d{4}-\d{2}-\d{2}$/;

          function getKstDate() {
            const now = new Date();
            const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
            const yyyy = kst.getUTCFullYear();
            const mm = String(kst.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(kst.getUTCDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
          }

          const date = manualDate || getKstDate();
          if (!datePattern.test(date)) {
            throw new Error(`Invalid newsletter date: ${date}`);
          }

          if (process.env.GITHUB_ENV) {
            fs.appendFileSync(process.env.GITHUB_ENV, `GENERATED_NEWSLETTER_DATE=${date}\n`, 'utf8');
          }

          const title = `Camera HAL SW Newsletter - ${date}`;
          const summary = '이번 주 AOSP Camera Watch, Tech Trend Radar, C++ / AI 실전 팁을 정리합니다.';
          const issueDir = path.join('newsletters', date);
          const mdPath = path.join(issueDir, 'newsletter.md');
          const htmlPath = path.join(issueDir, 'index.html');
          const dataPath = path.join('data', 'newsletters.json');

          fs.mkdirSync(issueDir, { recursive: true });

          function writeIfMissing(filePath, content) {
            if (fs.existsSync(filePath)) {
              console.log(`Skip existing file: ${filePath}`);
              return;
            }
            fs.writeFileSync(filePath, content, 'utf8');
            console.log(`Created: ${filePath}`);
          }

          const md = `# ${title}

## 1. 이번 주 3줄 브리핑

