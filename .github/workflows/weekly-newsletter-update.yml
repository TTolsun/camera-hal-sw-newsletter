          const html = `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${title}</title>
  <link rel="stylesheet" href="../../css/styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero newsletter-hero">
      <p class="eyebrow">WEEKLY NEWSLETTER</p>
