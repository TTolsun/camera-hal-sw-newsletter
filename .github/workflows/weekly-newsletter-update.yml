          writeIfMissing(mdPath, md);
          writeIfMissing(htmlPath, html);

          const newsletters = fs.existsSync(dataPath)
            ? JSON.parse(fs.readFileSync(dataPath, 'utf8'))
            : [];

          if (!Array.isArray(newsletters)) {
            throw new Error('data/newsletters.json must contain an array');
          }

          const entry = {
            date,
            title,
            summary,
            html: `newsletters/${date}/index.html`,
            md: `newsletters/${date}/newsletter.md`,
            tags: ['Camera HAL', 'Android', 'C++', 'AI']
          };

          const updated = newsletters
            .filter(item => item.date !== date)
            .concat(entry)
            .sort((a, b) => b.date.localeCompare(a.date));

          fs.writeFileSync(dataPath, `${JSON.stringify(updated, null, 2)}\n`, 'utf8');
          console.log(`Updated: ${dataPath}`);
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No newsletter changes to commit."
            exit 0
          fi

          git add data/newsletters.json newsletters/
          git commit -m "Add weekly newsletter ${GENERATED_NEWSLETTER_DATE}"
          git push
