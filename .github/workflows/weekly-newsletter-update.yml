name: Weekly Newsletter Basic Auto Update

on:
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-newsletter-basic-auto-update
  cancel-in-progress: false

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate basic weekly newsletter
        env:
          NEWSLETTER_DATE: ${{ github.event.inputs.newsletter_date }}
        run: |
          node scripts/generate-weekly-newsletter.js

      - name: Validate generated site
        run: |
          node scripts/validate-site.js

      - name: Commit and push changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newsletters.json newsletters/
          DATE=$(node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('data/newsletters.json','utf8'));console.log(data[0].date)")
          git commit -m "Add basic weekly newsletter ${DATE}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Create completion issue
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.commit.outputs.date }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Newsletter] Basic auto updated - ${date}`,
              body: [
                `Camera HAL SW Newsletter ${date} 기본 자동 업데이트가 완료되었습니다.`,
                '',
                '## Note',
                '',
                '이 workflow는 수동 실행용입니다.',
                '주간 정규 운영은 `Weekly Newsletter Newsroom` workflow를 사용합니다.'
              ].join('\n'),
              labels: ['newsletter', 'weekly']
            });
