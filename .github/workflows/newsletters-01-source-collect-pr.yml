name: Newsletters 01 - Source Collection PR

on:
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
      lookback_days:
        description: "How many days to look back when collecting news candidates."
        required: false
        default: "35"
        type: string
      manual_source_urls:
        description: "Optional ';'-separated http/https seed URLs. Empty uses articles/content/collected-news/<date>/collection-intent.json if present."
        required: false
        default: ""
        type: string
      coverage_week_key:
        description: "Coverage 주 override, 형식 YYYY-Www(예: 2026-W34). 비우면 실행일 기준 자동 계산."
        required: false
        default: ""
        type: string
      carry_source_path:
        description: "Carry-forward 원천 merged-candidates.json 경로 override(저장소 상대 또는 절대 경로). 비우면 직전 주 scheduled 실행분을 자동으로 찾는다."
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
        default: ""
      lookback_days:
        description: "How many days to look back when collecting news candidates."
        required: false
        type: string
        default: "35"
      auto_mode:
        description: "Set to true when called from the daily auto workflow (commit artifacts instead of creating PR)."
        required: false
        type: boolean
        default: false
      coverage_week_key:
        description: "Coverage 주 override, 형식 YYYY-Www. 비우면 실행일 기준 자동 계산."
        required: false
        type: string
        default: ""
      carry_source_path:
        description: "Carry-forward 원천 경로 override. 비우면 직전 주 scheduled 실행분을 자동으로 찾는다."
        required: false
        type: string
        default: ""
    outputs:
      date:
        description: "Resolved newsletter date (YYYY-MM-DD)"
        value: ${{ jobs.create-raw-candidate-pr.outputs.date }}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: newsroom-raw-${{ inputs.newsletter_date || github.event.inputs.newsletter_date || 'auto-kst-today' }}
  cancel-in-progress: false

jobs:
  create-raw-candidate-pr:
    runs-on: ubuntu-latest

    outputs:
      date: ${{ steps.raw-meta.outputs.date }}

    env:
      NEWSLETTER_DATE: ${{ inputs.newsletter_date || github.event.inputs.newsletter_date || '' }}
      # #574 주 1회 전환: lookback 윈도우를 35일로 단축한다(메인 21일 + reference 백스톱 35일).
      # 22-35일 후보는 catch-up 풀로 들어가 빈약주에도 본문을 채운다. runtime 기본값
      # (runtime-config.js)도 35일이며, 여기서 동일 값을 명시 전달한다.
      LOOKBACK_DAYS: ${{ inputs.lookback_days || github.event.inputs.lookback_days || '35' }}
      NEWSROOM_MANUAL_SOURCE_URLS: ${{ github.event.inputs.manual_source_urls }}
      # Task 12: coverage 주·carry-forward 원천 override. runtime-config.js가 형식을 검증하며
      # (COVERAGE_WEEK_KEY는 ^\d{4}-W\d{2}$ 위반 시 throw), 값이 비어 있으면 자동 계산/자동
      # lineage 선택으로 그대로 폴백한다(collect-news-candidates.js).
      COVERAGE_WEEK_KEY: ${{ inputs.coverage_week_key || github.event.inputs.coverage_week_key || '' }}
      CARRY_SOURCE_PATH: ${{ inputs.carry_source_path || github.event.inputs.carry_source_path || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Doctor runtime config
        run: npm run doctor:config -- --no-llm-credentials

      - name: Validate newsletter policy
        run: npm run validate:policy

      - name: Check policy docs
        run: npm run check:policy-docs

      - name: Run unit and regression tests
        run: npm run test

      - name: Collect RAW news candidates
        id: collect
        run: npm run collect

      - name: Resolve RAW metadata
        id: raw-meta
        run: |
          set -euo pipefail
          DATE="$(cat .tmp/news-candidate-date.txt)"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=newsroom-raw/${DATE}" >> "$GITHUB_OUTPUT"
          CANDIDATE_COUNT="$(node -e "const fs=require('fs'); const p='articles/content/collected-news/${DATE}/manual-candidates.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); console.log(Array.isArray(v.candidates)?v.candidates.length:0)")"
          echo "candidate_count=${CANDIDATE_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Generate evidence pack summary
        if: always() && steps.raw-meta.outputs.date != ''
        continue-on-error: true
        run: npm run report:evidence-pack -- --date "${{ steps.raw-meta.outputs.date }}"

      - name: Prepare RAW pull request body
        id: pr-body
        if: inputs.auto_mode != true
        run: |
          mkdir -p .tmp
          node src/collector/build-raw-candidate-pr-body.js --date "${{ steps.raw-meta.outputs.date }}" > .tmp/raw-candidate-pr-body.md
          {
            echo "body<<EOF"
            cat .tmp/raw-candidate-pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure labels
        if: inputs.auto_mode != true
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = [
              { name: 'newsletter', color: '1b58b5', description: 'Camera HAL / SW Newsletter' },
              { name: 'aosp-camera', color: '0e8a16', description: 'AOSP Camera and camera stack scope' },
              { name: 'editor-review', color: 'fbca04', description: 'Editor-in-chief review required' },
              { name: 'raw-candidates', color: 'c5def5', description: 'RAW newsroom candidate review' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

      - name: Create RAW candidate pull request
        id: cpr
        if: inputs.auto_mode != true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Collect Camera HAL RAW candidates ${{ steps.raw-meta.outputs.date }}"
          branch: ${{ steps.raw-meta.outputs.branch }}
          delete-branch: true
          title: "[Newsroom RAW] Camera HAL candidates - ${{ steps.raw-meta.outputs.date }}"
          body: ${{ steps.pr-body.outputs.body }}
          labels: newsletter,aosp-camera,editor-review,raw-candidates

      - name: Commit candidates to main (auto mode)
        if: inputs.auto_mode == true
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add articles/content/collected-news/ articles/content/source-events/ state/source-snapshots/ state/deep-dive-topic-queue.json || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(newsroom): collect raw candidates for ${{ steps.raw-meta.outputs.date }}"
            # collect/report 스텝이 git add 대상 밖(articles/content/newsroom 등)의 추적 파일도 건드려
            # 작업트리에 unstaged 변경이 남을 수 있다. --autostash로 stash 후 rebase하여
            # "cannot pull with rebase: You have unstaged changes" 실패를 방지한다.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Upload RAW debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-raw-debug-${{ github.run_id }}
          path: |
            .tmp/news-candidate-date.txt
            articles/content/collected-news/${{ steps.raw-meta.outputs.date }}/manual-candidates.json
            articles/content/collected-news/${{ steps.raw-meta.outputs.date }}/candidates.json
            articles/content/collected-news/${{ steps.raw-meta.outputs.date }}/collection-intent.json
            articles/content/collected-news/${{ steps.raw-meta.outputs.date }}/raw-candidate-manifest.json
            articles/content/source-events/${{ steps.raw-meta.outputs.date }}/source-change-events.json
            articles/content/source-events/${{ steps.raw-meta.outputs.date }}/source-change-events.md
            articles/content/newsroom/${{ steps.raw-meta.outputs.date }}/news-candidates.md
            state/source-snapshots/**
            state/deep-dive-topic-queue.json
            .tmp/not-yet-eligible-full.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write workflow run summary
        if: always()
        continue-on-error: true
        env:
          SUMMARY_PROFILE: source-collect
          OUTCOME_COLLECT: ${{ steps.collect.outcome }}
          NEWSLETTER_DATE: ${{ steps.raw-meta.outputs.date }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEBUG_ARTIFACT_NAME: newsroom-raw-debug-${{ github.run_id }}
        run: node src/shared/tooling/cli/write-newsroom-workflow-summary.js --profile "$SUMMARY_PROFILE"
