name: Weekly Newsletter Issue

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-newsletter-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create weekly newsletter issue
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();

            // Convert to KST for newsletter date.
            const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
            const yyyy = kst.getUTCFullYear();
            const mm = String(kst.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(kst.getUTCDate()).padStart(2, '0');
            const date = `${yyyy}-${mm}-${dd}`;

            const title = `[Newsletter] Camera HAL SW Newsletter - ${date}`;

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const duplicated = existingIssues.data.some(issue => issue.title === title);

            if (duplicated) {
              core.info(`Issue already exists: ${title}`);
              return;
            }

            for (const label of ['newsletter', 'weekly']) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'newsletter' ? '1b58b5' : '32ad57',
                  description: label === 'newsletter'
                    ? 'Camera HAL SW Newsletter'
                    : 'Weekly recurring work'
                });
              }
            }

            const body = [
              '## Goal',
              '',
              '이번 주 Camera HAL SW Newsletter를 수동 보완합니다.',
              '',
              '## Output Files',
              '',
              `- \`newsletters/${date}/newsletter.md\``,
              `- \`newsletters/${date}/index.html\``,
              '- `data/newsletters.json` 업데이트',
              '',
              '## Required Sections',
              '',
              '- [ ] 이번 주 3줄 브리핑',
              '- [ ] AOSP Camera Watch',
              '- [ ] Tech Trend Radar',
              '- [ ] 이번 주 C++ / AI 실전 팁',
              '- [ ] 이번 주 Action Items',
              '- [ ] References',
              '',
              '## Note',
              '',
              '자동 업데이트는 `Weekly Newsletter Auto Update` workflow가 담당합니다.',
              '이 Issue workflow는 사람이 수동으로 보완 작업을 잡고 싶을 때만 실행합니다.',
              '',
              '## PR Rule',
              '',
              'PR 제목은 아래 형식을 사용합니다.',
              '',
              '```',
              `[Newsletter] Update Camera HAL SW Newsletter - ${date}`,
              '```'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['newsletter', 'weekly'],
              assignees: ['TTolsun']
            });
