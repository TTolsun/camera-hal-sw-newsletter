name: Newsletters 02 - Source Discovery PR

on:
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        default: ""
        type: string
      llm_provider:
        description: "LLM provider override for source discovery manual runs. Current code default: Gemini. Choices: default(code default), gemini, openapi(reserved fail-fast)."
        required: false
        default: "default"
        type: choice
        options:
          - "default"
          - "gemini"
          - "openapi"
      llm_model:
        description: "Optional LLM model override for this manual run."
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
        default: ""
      auto_mode:
        description: "Set to true when called from the daily auto workflow (commit artifacts instead of creating PR)."
        required: false
        type: boolean
        default: false
    outputs:
      date:
        description: "Resolved newsletter date (YYYY-MM-DD)"
        value: ${{ jobs.create-source-discovery-pr.outputs.date }}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: newsroom-source-discovery-${{ inputs.newsletter_date || github.event.inputs.newsletter_date || 'auto-kst-today' }}
  cancel-in-progress: false

jobs:
  create-source-discovery-pr:
    outputs:
      date: ${{ steps.resolve-newsletter-date.outputs.date }}
    runs-on: ubuntu-latest

    env:
      NEWSLETTER_DATE: ${{ inputs.newsletter_date || github.event.inputs.newsletter_date || '' }}
      NEWSROOM_ENABLE_GEMINI_SOURCE_DISCOVERY: "true"
      LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'default' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve newsletter date
        id: resolve-newsletter-date
        env:
          INPUT_NEWSLETTER_DATE: ${{ inputs.newsletter_date || github.event.inputs.newsletter_date || '' }}
        run: |
          set -euo pipefail

          DATE="${INPUT_NEWSLETTER_DATE:-}"
          if [ -z "$DATE" ]; then
            DATE="$(TZ=Asia/Seoul date +%F)"
          fi

          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "newsletter_date must be YYYY-MM-DD: $DATE"
            exit 1
          fi

          echo "Newsletter date in YYYY-MM-DD. Empty means today in KST."
          echo "Resolved newsletter date: $DATE"
          echo "NEWSLETTER_DATE=$DATE" >> "$GITHUB_ENV"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Apply manual LLM overrides
        env:
          INPUT_LLM_MODEL: ${{ github.event.inputs.llm_model }}
        run: |
          set -euo pipefail

          case "${INPUT_LLM_MODEL:-}" in
            *$'\n'*|*$'\r'*)
              echo "Workflow inputs must be single-line values."
              exit 1
              ;;
          esac

          if [ -n "${INPUT_LLM_MODEL:-}" ]; then
            echo "LLM_MODEL=${INPUT_LLM_MODEL}" >> "$GITHUB_ENV"
          fi

      - name: Validate newsroom source discovery boundary
        run: npm run validate:config

      - name: Run Gemini source discovery
        id: source-discovery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/discovery/gemini-source-discovery-boundary.js --date "${NEWSLETTER_DATE}"

      - name: Prepare source discovery pull request body
        id: pr-body
        if: inputs.auto_mode != true
        run: |
          REPORT="articles/content/newsroom/${NEWSLETTER_DATE}/gemini-source-discovery-report.md"
          {
            echo "body<<EOF"
            cat "$REPORT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit discovery artifacts to main (auto mode)
        if: inputs.auto_mode == true
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add articles/content/collected-news/ articles/content/newsroom/ || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(newsroom): source discovery artifacts for ${{ steps.resolve-newsletter-date.outputs.date }}"
            # git add 대상 밖의 추적 파일이 unstaged로 남아도 rebase가 실패하지 않도록 --autostash 사용.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Upload source discovery debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-source-discovery-debug-${{ github.run_id }}
          path: |
            articles/content/collected-news/${{ steps.resolve-newsletter-date.outputs.date }}/gemini-candidates.json
            articles/content/collected-news/${{ steps.resolve-newsletter-date.outputs.date }}/seed-candidates.json
            articles/content/collected-news/${{ steps.resolve-newsletter-date.outputs.date }}/seed-evidence-pack.json
            articles/content/collected-news/${{ steps.resolve-newsletter-date.outputs.date }}/merged-candidates.json
            articles/content/collected-news/${{ steps.resolve-newsletter-date.outputs.date }}/merged-candidate-manifest.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/seed-fetch-report.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/seed-fetch-report.md
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/seed-evidence-pack.md
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/seed-merge-report.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/seed-merge-report.md
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/gemini-source-proposals.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/gemini-source-proposal-validation-report.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/gemini-usage-report.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/extracted-source-facts.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/source-quality-report.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/source-quality-report.md
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/source-clusters.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/evidence-validation-report.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/source-discovery-feedback-report.json
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/source-discovery-feedback-report.md
            articles/content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/gemini-source-discovery-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Ensure labels
        if: inputs.auto_mode != true
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = [
              { name: 'newsletter', color: '1b58b5', description: 'Camera HAL / SW Newsletter' },
              { name: 'aosp-camera', color: '0e8a16', description: 'AOSP Camera and camera stack scope' },
              { name: 'source-discovery', color: 'c5def5', description: 'Optional newsroom source discovery boundary' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

      - name: Create source discovery pull request
        id: cpr
        if: inputs.auto_mode != true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Merge Camera HAL candidate artifacts ${{ steps.resolve-newsletter-date.outputs.date }}"
          branch: newsroom-source-discovery/${{ steps.resolve-newsletter-date.outputs.date }}
          delete-branch: true
          title: "[Newsroom Source Discovery] Candidate boundary - ${{ steps.resolve-newsletter-date.outputs.date }}"
          body: ${{ steps.pr-body.outputs.body }}
          labels: newsletter,aosp-camera,source-discovery

      - name: Write workflow run summary
        if: always()
        continue-on-error: true
        env:
          SUMMARY_PROFILE: source-discovery
          OUTCOME_DISCOVERY: ${{ steps.source-discovery.outcome }}
          NEWSLETTER_DATE: ${{ steps.resolve-newsletter-date.outputs.date }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEBUG_ARTIFACT_NAME: newsroom-source-discovery-debug-${{ github.run_id }}
        run: node src/shared/tooling/cli/write-newsroom-workflow-summary.js --profile "$SUMMARY_PROFILE"
