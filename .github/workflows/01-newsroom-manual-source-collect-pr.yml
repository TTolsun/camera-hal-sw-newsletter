name: Newsroom 01 - Manual Source Collection PR

on:
  schedule:
    - cron: "0 0 * * *" # KST daily 09:00
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
      lookback_days:
        description: "How many days to look back when collecting news candidates."
        required: false
        default: "21"
        type: string
      collection_intent_path:
        description: "Optional collection intent artifact path. Empty uses content/collected-news/<date>/collection-intent.json if present."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: newsroom-raw-${{ github.event.inputs.newsletter_date || github.run_id }}
  cancel-in-progress: false

jobs:
  create-raw-candidate-pr:
    runs-on: ubuntu-latest

    env:
      NEWSLETTER_DATE: ${{ github.event.inputs.newsletter_date }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '21' }}
      NEWSROOM_COLLECTION_INTENT_PATH: ${{ github.event.inputs.collection_intent_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Doctor runtime config
        run: npm run doctor:config -- --no-llm-credentials

      - name: Validate newsletter policy
        run: npm run validate:policy

      - name: Check policy docs
        run: npm run check:policy-docs

      - name: Run unit and regression tests
        run: npm run test

      - name: Collect RAW news candidates
        run: npm run collect

      - name: Resolve RAW metadata
        id: raw-meta
        run: |
          set -euo pipefail
          DATE="$(cat .tmp/news-candidate-date.txt)"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=newsroom-raw/${DATE}" >> "$GITHUB_OUTPUT"
          CANDIDATE_COUNT="$(node -e "const fs=require('fs'); const p='content/collected-news/${DATE}/manual-candidates.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); console.log(Array.isArray(v.candidates)?v.candidates.length:0)")"
          echo "candidate_count=${CANDIDATE_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Generate source effectiveness report
        if: always() && steps.raw-meta.outputs.date != ''
        continue-on-error: true
        run: npm run report:source-effectiveness -- --date "${{ steps.raw-meta.outputs.date }}"

      - name: Generate evidence pack summary
        if: always() && steps.raw-meta.outputs.date != ''
        continue-on-error: true
        run: npm run report:evidence-pack -- --date "${{ steps.raw-meta.outputs.date }}"

      - name: Prepare RAW pull request body
        id: pr-body
        run: |
          mkdir -p .tmp
          node scripts/build-raw-candidate-pr-body.js --date "${{ steps.raw-meta.outputs.date }}" > .tmp/raw-candidate-pr-body.md
          {
            echo "body<<EOF"
            cat .tmp/raw-candidate-pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure labels
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = [
              { name: 'newsletter', color: '1b58b5', description: 'Camera HAL SW Newsletter' },
              { name: 'aosp-camera', color: '0e8a16', description: 'AOSP Camera and camera stack scope' },
              { name: 'editor-review', color: 'fbca04', description: 'Editor-in-chief review required' },
              { name: 'raw-candidates', color: 'c5def5', description: 'RAW newsroom candidate review' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

      - name: Create RAW candidate pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Collect Camera HAL RAW candidates ${{ steps.raw-meta.outputs.date }}"
          branch: ${{ steps.raw-meta.outputs.branch }}
          delete-branch: true
          title: "[Newsroom RAW] Camera HAL candidates - ${{ steps.raw-meta.outputs.date }}"
          body: ${{ steps.pr-body.outputs.body }}
          labels: newsletter,aosp-camera,editor-review,raw-candidates

      - name: Upload RAW debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-raw-debug-${{ github.run_id }}
          path: |
            .tmp/news-candidate-date.txt
            content/collected-news/${{ steps.raw-meta.outputs.date }}/manual-candidates.json
            content/collected-news/${{ steps.raw-meta.outputs.date }}/candidates.json
            content/collected-news/${{ steps.raw-meta.outputs.date }}/collection-intent.json
            content/collected-news/${{ steps.raw-meta.outputs.date }}/raw-candidate-manifest.json
            content/source-events/${{ steps.raw-meta.outputs.date }}/source-change-events.json
            content/source-events/${{ steps.raw-meta.outputs.date }}/source-change-events.md
            content/newsroom/${{ steps.raw-meta.outputs.date }}/news-candidates.md
            data/source-snapshots/**
          if-no-files-found: warn
          retention-days: 14
