name: Newsletters 01 - Source Collection PR

on:
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
      lookback_days:
        description: "How many days to look back when collecting news candidates."
        required: false
        default: "90"
        type: string
      manual_source_urls:
        description: "Optional ';'-separated http/https seed URLs. Empty uses content/collected-news/<date>/collection-intent.json if present."
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        type: string
        default: ""
      lookback_days:
        description: "How many days to look back when collecting news candidates."
        required: false
        type: string
        default: "90"
      auto_mode:
        description: "Set to true when called from the daily auto workflow (commit artifacts instead of creating PR)."
        required: false
        type: boolean
        default: false
    outputs:
      date:
        description: "Resolved newsletter date (YYYY-MM-DD)"
        value: ${{ jobs.create-raw-candidate-pr.outputs.date }}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: newsroom-raw-${{ github.event.inputs.newsletter_date || github.run_id }}
  cancel-in-progress: false

jobs:
  create-raw-candidate-pr:
    runs-on: ubuntu-latest

    outputs:
      date: ${{ steps.raw-meta.outputs.date }}

    env:
      NEWSLETTER_DATE: ${{ inputs.newsletter_date || github.event.inputs.newsletter_date || '' }}
      # Runtime default lookback is 10 days (#487). This workflow keeps an explicit
      # 90-day window so 22-90 day candidates still feed the catch-up pool: with the
      # 10-day window thin days can leave the editor too few candidates to produce a
      # reviewable draft, and the weekly upsert only accumulates publish-ready runs.
      LOOKBACK_DAYS: ${{ inputs.lookback_days || github.event.inputs.lookback_days || '90' }}
      NEWSROOM_MANUAL_SOURCE_URLS: ${{ github.event.inputs.manual_source_urls }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Doctor runtime config
        run: npm run doctor:config -- --no-llm-credentials

      - name: Validate newsletter policy
        run: npm run validate:policy

      - name: Check policy docs
        run: npm run check:policy-docs

      - name: Run unit and regression tests
        run: npm run test

      - name: Collect RAW news candidates
        run: npm run collect

      - name: Resolve RAW metadata
        id: raw-meta
        run: |
          set -euo pipefail
          DATE="$(cat .tmp/news-candidate-date.txt)"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=newsroom-raw/${DATE}" >> "$GITHUB_OUTPUT"
          CANDIDATE_COUNT="$(node -e "const fs=require('fs'); const p='content/collected-news/${DATE}/manual-candidates.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); console.log(Array.isArray(v.candidates)?v.candidates.length:0)")"
          echo "candidate_count=${CANDIDATE_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Generate evidence pack summary
        if: always() && steps.raw-meta.outputs.date != ''
        continue-on-error: true
        run: npm run report:evidence-pack -- --date "${{ steps.raw-meta.outputs.date }}"

      - name: Prepare RAW pull request body
        id: pr-body
        if: inputs.auto_mode != true
        run: |
          mkdir -p .tmp
          node scripts/build-raw-candidate-pr-body.js --date "${{ steps.raw-meta.outputs.date }}" > .tmp/raw-candidate-pr-body.md
          {
            echo "body<<EOF"
            cat .tmp/raw-candidate-pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure labels
        if: inputs.auto_mode != true
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = [
              { name: 'newsletter', color: '1b58b5', description: 'Camera HAL / SW Newsletter' },
              { name: 'aosp-camera', color: '0e8a16', description: 'AOSP Camera and camera stack scope' },
              { name: 'editor-review', color: 'fbca04', description: 'Editor-in-chief review required' },
              { name: 'raw-candidates', color: 'c5def5', description: 'RAW newsroom candidate review' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

      - name: Create RAW candidate pull request
        id: cpr
        if: inputs.auto_mode != true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Collect Camera HAL RAW candidates ${{ steps.raw-meta.outputs.date }}"
          branch: ${{ steps.raw-meta.outputs.branch }}
          delete-branch: true
          title: "[Newsroom RAW] Camera HAL candidates - ${{ steps.raw-meta.outputs.date }}"
          body: ${{ steps.pr-body.outputs.body }}
          labels: newsletter,aosp-camera,editor-review,raw-candidates

      - name: Commit candidates to main (auto mode)
        if: inputs.auto_mode == true
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add content/collected-news/ content/source-events/ data/source-snapshots/ || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(newsroom): collect raw candidates for ${{ steps.raw-meta.outputs.date }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload RAW debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-raw-debug-${{ github.run_id }}
          path: |
            .tmp/news-candidate-date.txt
            content/collected-news/${{ steps.raw-meta.outputs.date }}/manual-candidates.json
            content/collected-news/${{ steps.raw-meta.outputs.date }}/candidates.json
            content/collected-news/${{ steps.raw-meta.outputs.date }}/collection-intent.json
            content/collected-news/${{ steps.raw-meta.outputs.date }}/raw-candidate-manifest.json
            content/source-events/${{ steps.raw-meta.outputs.date }}/source-change-events.json
            content/source-events/${{ steps.raw-meta.outputs.date }}/source-change-events.md
            content/newsroom/${{ steps.raw-meta.outputs.date }}/news-candidates.md
            data/source-snapshots/**
          if-no-files-found: warn
          retention-days: 14
