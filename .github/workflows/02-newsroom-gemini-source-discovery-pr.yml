name: Newsroom 02 - Gemini Source Discovery PR

on:
  workflow_dispatch:
    inputs:
      newsletter_date:
        description: "Newsletter date in YYYY-MM-DD. Empty means today in KST."
        required: false
        default: ""
        type: string
      llm_provider:
        description: "LLM provider override for source discovery manual runs. Current code default: Gemini. Choices: default(code default), gemini, openapi(reserved fail-fast), internal."
        required: false
        default: "default"
        type: choice
        options:
          - "default"
          - "gemini"
          - "openapi"
          - "internal"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: newsroom-source-discovery-${{ github.event.inputs.newsletter_date || 'auto-kst-today' }}
  cancel-in-progress: false

jobs:
  create-source-discovery-pr:
    runs-on: ubuntu-latest

    env:
      NEWSLETTER_DATE: ${{ github.event.inputs.newsletter_date }}
      NEWSROOM_ENABLE_GEMINI_SOURCE_DISCOVERY: "true"
      LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'default' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve newsletter date
        id: resolve-newsletter-date
        env:
          INPUT_NEWSLETTER_DATE: ${{ github.event.inputs.newsletter_date }}
        run: |
          set -euo pipefail

          DATE="${INPUT_NEWSLETTER_DATE:-}"
          if [ -z "$DATE" ]; then
            DATE="$(TZ=Asia/Seoul date +%F)"
          fi

          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "newsletter_date must be YYYY-MM-DD: $DATE"
            exit 1
          fi

          echo "Newsletter date in YYYY-MM-DD. Empty means today in KST."
          echo "Resolved newsletter date: $DATE"
          echo "NEWSLETTER_DATE=$DATE" >> "$GITHUB_ENV"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate newsroom source discovery boundary
        run: npm run validate:config

      - name: Run Gemini source discovery
        id: source-discovery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERNAL_LLM_API_KEY: ${{ secrets.INTERNAL_LLM_API_KEY }}
          INTERNAL_LLM_ENDPOINT: ${{ vars.INTERNAL_LLM_ENDPOINT || '' }}
          INTERNAL_LLM_API_VERSION: ${{ vars.INTERNAL_LLM_API_VERSION || '' }}
        run: node scripts/gemini-source-discovery-boundary.js --date "${NEWSLETTER_DATE}"

      - name: Prepare source discovery pull request body
        id: pr-body
        run: |
          REPORT="content/newsroom/${NEWSLETTER_DATE}/gemini-source-discovery-report.md"
          {
            echo "body<<EOF"
            cat "$REPORT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload source discovery debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-source-discovery-debug-${{ github.run_id }}
          path: |
            content/collected-news/${{ steps.resolve-newsletter-date.outputs.date }}/gemini-candidates.json
            content/collected-news/${{ steps.resolve-newsletter-date.outputs.date }}/seed-candidates.json
            content/collected-news/${{ steps.resolve-newsletter-date.outputs.date }}/seed-evidence-pack.json
            content/collected-news/${{ steps.resolve-newsletter-date.outputs.date }}/merged-candidates.json
            content/collected-news/${{ steps.resolve-newsletter-date.outputs.date }}/merged-candidate-manifest.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/seed-fetch-report.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/seed-fetch-report.md
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/seed-evidence-pack.md
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/seed-merge-report.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/seed-merge-report.md
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/gemini-source-proposals.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/gemini-source-proposal-validation-report.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/gemini-usage-report.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/extracted-source-facts.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/source-quality-report.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/source-quality-report.md
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/source-clusters.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/evidence-validation-report.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/source-discovery-feedback-report.json
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/source-discovery-feedback-report.md
            content/newsroom/${{ steps.resolve-newsletter-date.outputs.date }}/gemini-source-discovery-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Ensure labels
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const labels = [
              { name: 'newsletter', color: '1b58b5', description: 'Camera HAL / SW Newsletter' },
              { name: 'aosp-camera', color: '0e8a16', description: 'AOSP Camera and camera stack scope' },
              { name: 'source-discovery', color: 'c5def5', description: 'Optional newsroom source discovery boundary' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

      - name: Create source discovery pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Merge Camera HAL candidate artifacts ${{ steps.resolve-newsletter-date.outputs.date }}"
          branch: newsroom-source-discovery/${{ steps.resolve-newsletter-date.outputs.date }}
          delete-branch: true
          title: "[Newsroom Source Discovery] Candidate boundary - ${{ steps.resolve-newsletter-date.outputs.date }}"
          body: ${{ steps.pr-body.outputs.body }}
          labels: newsletter,aosp-camera,source-discovery
